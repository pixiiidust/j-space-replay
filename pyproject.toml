[project]
name = "jsr"
version = "0.1.0"
description = "J-Space-Replay: replay Qwen2.5-VL per-layer lens readouts synced to a video timeline"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
    # Windows compile-free rule: no flash-attn, no vLLM, no decord, no awq_ext.
    "torch>=2.7",
    "torchvision",
    "transformers>=4.51",
    "accelerate>=1.0",
    "bitsandbytes>=0.45",
    "qwen-vl-utils",
    "av>=14.0",
    "pillow>=10.0",
    "numpy",
    "huggingface_hub",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
]

[project.scripts]
jsr = "jsr.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff",
    "httpx>=0.27",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jsr"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs CUDA + downloaded model weights"]
